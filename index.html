<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Slider</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:#f5f5f5;
}

.slider{
    width:1000px;
    height:300px;
    overflow:hidden;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
    position:relative;
}

.slides{
    display:flex;
    width:3000px;
    height:300px;
    transition:transform 0.8s ease;
}

.slides img{
    width:1000px;
    height:300px;
    object-fit:cover;
}

.buttons{
    position:absolute;
    width:100%;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    justify-content:space-between;
    padding:0 10px;
}

.buttons button{
    background:rgba(0,0,0,0.5);
    color:white;
    border:none;
    padding:10px 15px;
    cursor:pointer;
    font-size:20px;
    border-radius:50%;
}

.buttons button:hover{
    background:rgba(0,0,0,0.8);
}
</style>
</head>
<body>

<div class="slider">
    <div class="slides" id="slides">
        <img src="Gemini_Generated_Image_3r5e1h3r5e1h3r5e.png" alt="รูปที่ 1">
        <img src="Gemini_Generated_Image_9x0c2g9x0c2g9x0c.png" alt="รูปที่ 2">
        <img src="Gemini_Generated_Image_olo8xbolo8xbolo8.png" alt="รูปที่ 3">
    </div>

    <div class="buttons">
        <button onclick="prevSlide()">❮</button>
        <button onclick="nextSlide()">❯</button>
    </div>
</div>

<script>
let currentIndex = 0;
const slides = document.getElementById("slides");
const totalSlides = 3;

function showSlide(index){
    slides.style.transform = `translateX(-${index * 1000}px)`;
}

function nextSlide(){
    currentIndex = (currentIndex + 1) % totalSlides;
    showSlide(currentIndex);
}

function prevSlide(){
    currentIndex = (currentIndex - 1 + totalSlides) % totalSlides;
    showSlide(currentIndex);
}

// เลื่อนอัตโนมัติทุก 8 วินาที
setInterval(nextSlide, 8000);
</script>

</body>
</html>
