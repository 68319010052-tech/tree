<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week2-2: Slideshow / Carousel</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
        }

        /* ส่วนควบคุมขนาดของสไลด์โชว์ (บังคับขนาดตามโจทย์ 1000px * 300px) */
        .slideshow-container {
            max-width: 1000px;
            height: 300px;
            position: relative;
            margin: auto;
            overflow: hidden; /* ป้องกันรูปภาพล้นเกินขนาดที่กำหนด */
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            border-radius: 8px;
        }

        /* ซ่อนรูปภาพทั้งหมดในตอนเริ่มต้น */
        .mySlides {
            display: none;
            height: 100%;
        }

        /* บังคับขนาดรูปภาพให้พอดีกับ Container 1000x300 */
        .mySlides img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* ช่วยให้รูปภาพไม่เบี้ยวแม้สัดส่วนจะเปลี่ยนไป */
        }

        /* ปุ่มย้อนกลับ และ ปุ่มถัดไป (Next & previous buttons) */
        .prev, .next {
            cursor: pointer;
            position: absolute;
            top: 50%;
            width: auto;
            padding: 16px;
            margin-top: -22px;
            color: white;
            font-weight: bold;
            font-size: 18px;
            transition: 0.6s ease;
            border-radius: 0 3px 3px 0;
            user-select: none;
            background-color: rgba(0,0,0,0.3);
        }

        /* จัดตำแหน่งปุ่มถัดไปไว้ทางขวา */
        .next {
            right: 0;
            border-radius: 3px 0 0 3px;
        }

        /* เอฟเฟกต์เมื่อเอาเมาส์ไปชี้ที่ปุ่ม */
        .prev:hover, .next:hover {
            background-color: rgba(0,0,0,0.8);
        }

        /* ข้อความอธิบายรายละเอียดบนภาพ (Caption text) */
        .text {
            color: #f2f2f2;
            font-size: 16px;
            padding: 8px 12px;
            position: absolute;
            bottom: 8px;
            width: 100%;
            text-align: center;
            background-color: rgba(0, 0, 0, 0.5);
        }

        /* ตัวเลขแสดงลำดับรูปภาพ (1/3, 2/3, 3/3) */
        .numbertext {
            color: #f2f2f2;
            font-size: 12px;
            padding: 8px 12px;
            position: absolute;
            top: 0;
        }

        /* ส่วนของจุดกลมๆ ด้านล่าง (Dots/bullets/indicators) */
        .dot-container {
            text-align: center;
            margin-top: 15px;
        }

        .dot {
            cursor: pointer;
            height: 15px;
            width: 15px;
            margin: 0 2px;
            background-color: #bbb;
            border-radius: 50%;
            display: inline-block;
            transition: background-color 0.6s ease;
        }

        .active, .dot:hover {
            background-color: #717171;
        }

        /* เอฟเฟกต์การเปลี่ยนรูป (Fading animation) */
        .fade {
            animation-name: fade;
            animation-duration: 1.5s;
        }

        @keyframes fade {
            from {opacity: .4} 
            to {opacity: 1}
        }
    </style>
</head>
<body>

    <h2 style="text-align:center">การพัฒนาซอฟต์แวร์ด้วยเทคโนโลยี Front-End</h2>
    <p style="text-align:center"></p>

    <div class="slideshow-container">

        <div class="mySlides fade">
            <div class="numbertext">1 / 3</div>
            <img src="Gemini_Generated_Image_9x0c2g9x0c2g9x0c.png" alt="รูปวิชาที่ 1">
            <div class="text">แนะนำรายวิชา</div>
        </div>

        <div class="mySlides fade">
            <div class="numbertext">2 / 3</div>
            <img src="Gemini_Generated_Image_olo8xbolo8xbolo8.png" alt="รูปวิชาที่ 2">
            <div class="text">เรียนรู้โครงสร้างและการตกแต่งเว็บด้วย HTML/CSS</div>
        </div>

        <div class="mySlides fade">
            <div class="numbertext">3 / 3</div>
            <img src="Gemini_Generated_Image_3r5e1h3r5e1h3r5e.png" alt="รูปวิชาที่ 3">
            <div class="text">การสร้างปฏิสัมพันธ์ของเว็บด้วย JavaScript</div>
        </div>

        <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
        <a class="next" onclick="plusSlides(1)">&#10095;</a>
    </div>
    <br>

    <div class="dot-container">
        <span class="dot" onclick="currentSlide(1)"></span> 
        <span class="dot" onclick="currentSlide(2)"></span> 
        <span class="dot" onclick="currentSlide(3)"></span> 
    </div>

    <script>
        let slideIndex = 1;
        showSlides(slideIndex);

        // ฟังก์ชันเมื่อคลิกปุ่ม Next หรือ Previous
        function plusSlides(n) {
            showSlides(slideIndex += n);
        }

        // ฟังก์ชันเมื่อคลิกที่จุดกลมๆ ด้านล่าง
        function currentSlide(n) {
            showSlides(slideIndex = n);
        }

        // ฟังก์ชันหลักในการแสดงผลสไลด์
        function showSlides(n) {
            let i;
            let slides = document.getElementsByClassName("mySlides");
            let dots = document.getElementsByClassName("dot");
            
            if (n > slides.length) { slideIndex = 1 }    
            if (n < 1) { slideIndex = slides.length }
            
            for (i = 0; i < slides.length; i++) {
                slides[i].style.display = "none";  
            }
            for (i = 0; i < dots.length; i++) {
                dots[i].className = dots[i].className.replace(" active", "");
            }
            
            slides[slideIndex-1].style.display = "block";  
            dots[slideIndex-1].className += " active";
        }
    </script>

</body>
</html>
